<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Your Voice</title>
  <!-- The Woodshed has been renamed to "Find Your Voice" and moved to /voice/. -->
  <link rel="canonical" href="https://www.freshcognate.com/voice/">
  <meta http-equiv="refresh" content="0; url=../voice/">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0a1628;
      color: #f0f2f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 420px; }
    .brand {
      font-size: 26px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
      background: linear-gradient(90deg,#e84a27,#f39336,#f5c84b,#4fbf6a,#3b8fe6,#c850c0);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }
    p { color: #b8cadb; line-height: 1.5; margin: 8px 0; }
    a { color: #e84a27; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    // Release the old Woodshed service worker + caches (from when this URL
    // hosted the app), then continue to the new home. Belt-and-suspenders
    // alongside the self-destructing woodshed-sw.js.
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(k => k.includes('woodshed')).map(k => caches.delete(k)));
        }
      } catch (e) { /* non-fatal */ }
      location.replace('../voice/');
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="brand">Find Your Voice</div>
    <p>The Woodshed is now <strong>Find Your Voice</strong>.</p>
    <p><a href="../voice/">Continue to Find Your Voice &rarr;</a></p>
  </div>
</body>
</html>
